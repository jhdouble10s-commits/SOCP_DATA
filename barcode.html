<body class="tool-page"><main><header><div><div class="eyebrow">Label Studio</div><h1>바코드 라벨 PNG 생성기</h1><p>엑셀을 브라우저에서만 안전하게 처리합니다.</p></div><span class="privacy">서버 업로드 없음 · 로컬 처리</span></header>
<section class="card data-entry"><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden><label id="drop" class="drop" for="file"><strong>엑셀 파일을 여기에 놓거나 선택하세요</strong><span>.xlsx · .xls · .csv / A열 바코드 번호, B열 제품명 / 1행 헤더</span></label><div class="paste-entry"><label for="pasteData">또는 엑셀에서 A열(바코드) · B열(제품명)을 그대로 복사해 붙여넣으세요</label><textarea id="pasteData" rows="5" placeholder="바코드 번호&#9;제품명&#10;880000000001&#9;예시 제품명"></textarea><button id="pasteApply" type="button">붙여넣은 데이터 적용</button></div></section>
<section class="card split"><aside class="settings"><h2>라벨 설정</h2><div id="settings"></div><div class="setting-title">필수 문구 위치 (px)</div><label>MADE IN CHINA X <input data-k="madeInChinaX" type="number" min="0"></label><label>MADE IN CHINA Y <input data-k="madeInChinaY" type="number" min="0"></label><label>14세 이상 사용 가능 X <input data-k="ageNoticeX" type="number" min="0"></label><label>14세 이상 사용 가능 Y <input data-k="ageNoticeY" type="number" min="0"></label><div class="setting-title">필수 문구 글자 크기 (px)</div><label>MADE IN CHINA <input data-k="madeInChinaSize" type="number" min="1"></label><label>14세 이상 사용 가능 <input data-k="ageNoticeSize" type="number" min="1"></label><label>파일명 뒤 문구 <input id="suffix" type="text" placeholder="예: _2026, -검수완료"></label><small>기본: 바코드번호.png<br>입력 시: 바코드번호_문구.png</small><div class="setting-title">라벨 설정 프리셋 (이 브라우저에 저장)</div><div class="preset-row"><select id="preset"><option value="">저장된 프리셋 없음</option></select><button id="presetLoad">적용</button><button id="presetDelete">삭제</button></div><div class="preset-row"><button id="presetSave">현재 설정 저장</button><button id="reset">기본값</button></div></aside><section class="preview"><div class="toolbar"><h2>미리보기</h2><div><button id="prev">이전</button><span id="page">0 / 0</span><button id="next">다음</button></div></div><div id="empty" class="empty">엑셀 파일을 업로드하면 실제 PNG 미리보기가 표시됩니다.</div><canvas id="canvas" hidden></canvas><div id="info" hidden><b id="name"></b> · <span id="code" class="code"></span> <button id="one">PNG 다운로드</button></div></section></section>
<section id="data" class="card" hidden><div class="toolbar"><div><h2>데이터 목록 <span id="count"></span></h2><label><input type="checkbox" id="include"> 오류 행도 생성에 포함</label></div><button id="zip" class="zip">전체 바코드 ZIP 다운로드</button></div><div id="message"></div><div class="table"><table><thead><tr><th>행</th><th>제품명</th><th>바코드 번호</th><th>상태</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section></main>
<style>.settings{min-height:650px}.settings #suffix{width:125px}.settings small{display:block;color:#64748b;font-size:11px;padding-top:8px}.paste-entry{margin-top:22px;padding-top:18px;border-top:1px solid #e4e8ee}.paste-entry label{display:block;margin-bottom:8px;font-size:13px;font-weight:bold;color:#334155}.paste-entry textarea{display:block;width:100%;resize:vertical;padding:10px;border:1px solid #b7c5d8;border-radius:8px;font:13px/1.45 Arial,"Malgun Gothic",sans-serif}.paste-entry button{margin-top:9px}html[data-theme=dark] .paste-entry{border-color:#303030}html[data-theme=dark] .paste-entry label{color:#e5e7eb}html[data-theme=dark] .paste-entry textarea{background:#191919;color:#e5e7eb;border-color:#303030}</style>
<script>
window.addEventListener('load', () => {
  const defaults = {width:450,height:260,nameSize:22,nameLines:2,barcodeMargin:18,barcodeHeight:95,codeSize:22,topPadding:20,nameGap:12,codeGap:15,madeInChinaX:20,madeInChinaY:230,madeInChinaSize:20,ageNoticeX:250,ageNoticeY:230,ageNoticeSize:20};
  const applyDefaults = () => Object.entries(defaults).forEach(([key, value]) => {
    const input = document.querySelector(`[data-k="${key}"]`);
    if (!input) return;
    input.value = value;
    input.dispatchEvent(new Event('input', {bubbles:true}));
  });
  applyDefaults();
  const sheetToJson = XLSX.utils.sheet_to_json;
  XLSX.utils.sheet_to_json = function (...args) {
    return sheetToJson.apply(this, args).map(row => Array.isArray(row) ? [row[1] || '', row[0] || '', ...row.slice(2)] : row);
  };
  const fileInput = document.getElementById('file');
  const legacyFileChange = fileInput.onchange;
  fileInput.onchange = async event => {
    const source = event.target.files[0];
    if (!source || !/\.csv$/i.test(source.name)) return legacyFileChange(event);
    // CSV를 UTF-8 BOM으로 정규화해 한글 제품명이 깨지지 않도록 한다.
    const text = (await source.text()).replace(/^\uFEFF/, '');
    const utf8BomFile = new File([`\uFEFF${text}`], source.name, {type:'text/csv;charset=utf-8'});
    legacyFileChange({target:{files:[utf8BomFile]}});
  };
  document.getElementById('drop').ondrop = event => {
    event.preventDefault();
    event.currentTarget.classList.remove('drag');
    const source = event.dataTransfer.files[0];
    if (source) fileInput.onchange({target:{files:[source]}});
  };
  document.getElementById('reset').onclick = () => {
    document.getElementById('suffix').value = '';
    applyDefaults();
  };
  document.getElementById('pasteApply').onclick = () => {
    const text = document.getElementById('pasteData').value.trim();
    if (!text) return;
    const first = text.split(/\r?\n/, 1)[0];
    const hasHeader = /바코드|barcode|제품명|product/i.test(first);
    const csvText = hasHeader ? text : `바코드 번호\t제품명\n${text}`;
    const file = new File([`\uFEFF${csvText}`], 'pasted-barcode-data.csv', {type:'text/csv;charset=utf-8'});
    fileInput.onchange({target:{files:[file]}});
  };
});
</script>
<script>(()=>{const $=x=>document.getElementById(x),d={width:450,height:260,nameSize:22,nameLines:2,barcodeMargin:18,barcodeHeight:95,codeSize:22,topPadding:19,nameGap:17,codeGap:6,madeInChinaX:20,madeInChinaY:232,madeInChinaSize:12,ageNoticeX:250,ageNoticeY:232,ageNoticeSize:12},presetKey='barcodeLabelPresets';let s={...d},rows=[],sel=0;const fields=[['width','이미지 가로'],['height','이미지 세로'],['nameSize','제품명 글자'],['nameLines','제품명 최대 줄'],['barcodeMargin','바코드 좌우 여백'],['barcodeHeight','바코드 높이'],['codeSize','번호 글자'],['topPadding','상단 여백'],['nameGap','제품명-바코드 간격'],['codeGap','바코드-번호 간격']];$('settings').innerHTML=fields.map(x=>`<label>${x[1]} <input data-k="${x[0]}" type="number" min="0" value="${s[x[0]]}"></label>`).join('');const fn=x=>`${String(x).replace(/[\\/:*?"<>|]/g,'_').trim()||'바코드없음'}${$('suffix').value.trim()}.png`,esc=x=>String(x).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function sync(){document.querySelectorAll('[data-k]').forEach(x=>x.value=s[x.dataset.k])}function presets(){try{return JSON.parse(localStorage.getItem(presetKey))||{}}catch(e){return{}}}function paintPresets(selected=''){let p=presets(),names=Object.keys(p);$('preset').innerHTML=names.length?'<option value="">프리셋 선택</option>'+names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join(''):'<option value="">저장된 프리셋 없음</option>'}function config(){return{settings:{...s},suffix:$('suffix').value}}function apply(c){if(!c)return;s={...d,...(c.settings||{})};$('suffix').value=c.suffix||'';sync();preview()}function lines(x,t,w,n){let a=[],z='';for(const q of String(t||'제품명 없음').trim().split(/\s+/)){let y=z?z+' '+q:q;if(x.measureText(y).width<=w){z=y;continue}if(z)a.push(z);z=q}if(z&&a.length<n)a.push(z);return a.slice(0,n)}function render(r){let c=document.createElement('canvas'),x=c.getContext('2d');c.width=s.width;c.height=s.height;x.fillStyle='#fff';x.fillRect(0,0,s.width,s.height);x.fillStyle='#000';x.font=`700 ${s.nameSize}px Arial, Malgun Gothic`;x.textBaseline='top';let a=lines(x,r.name,s.width-40,s.nameLines);a.forEach((v,i)=>x.fillText(v,20,s.topPadding+i*s.nameSize*1.25));let y=s.topPadding+a.length*s.nameSize*1.25+s.nameGap,b=document.createElement('canvas');try{JsBarcode(b,r.code||'ERROR',{format:'CODE128',displayValue:false,margin:0,width:2,height:s.barcodeHeight});x.imageSmoothingEnabled=false;x.drawImage(b,0,0,b.width,b.height,s.barcodeMargin,y,s.width-s.barcodeMargin*2,s.barcodeHeight)}catch(e){}x.font=`700 ${s.codeSize}px Arial, Malgun Gothic`;x.textAlign='center';x.fillText(r.code||'바코드 없음',s.width/2,y+s.barcodeHeight+s.codeGap);x.textAlign='left';x.font=`${s.madeInChinaSize}px Arial, Malgun Gothic`;x.fillText('MADE IN CHINA',s.madeInChinaX,s.madeInChinaY);x.font=`${s.ageNoticeSize}px Arial, Malgun Gothic`;x.fillText('14세 이상 사용 가능',s.ageNoticeX,s.ageNoticeY);return c}function use(){return rows.filter(r=>$('include').checked||!r.e.length)}function preview(){let r=rows[sel],c=$('canvas');$('page').textContent=rows.length?`${sel+1} / ${rows.length}`:'0 / 0';$('prev').disabled=!sel;$('next').disabled=!rows.length||sel===rows.length-1;if(!r)return;c=Object.assign(c,{width:s.width,height:s.height});c.getContext('2d').drawImage(render(r),0,0);c.hidden=false;$('empty').hidden=true;$('info').hidden=false;$('name').textContent=r.name;$('code').textContent=r.code}function table(){let u=use();$('count').textContent=rows.length;$('zip').textContent=`전체 바코드 ZIP 다운로드 (${u.length})`;$('tbody').innerHTML=rows.map((r,i)=>`<tr class="${i===sel?'active':''}" data-i="${i}"><td>${r.row}</td><td>${esc(r.name||'-')}</td><td class="code">${esc(r.code||'-')}</td><td>${r.e.length?`<span class="bad">${esc(r.e.join(', '))}</span>`:'<span class="ok">정상</span>'}</td><td><button class="png" data-i="${i}" ${r.e.length&&!$('include').checked?'disabled':''}>PNG</button></td></tr>`).join('')}function msg(t,p){$('message').innerHTML=t?`<div class="${p?'progress':'notice'}">${t}</div>`:''}function download(r){render(r).toBlob(b=>saveAs(b,fn(r.code)))}function load(f){let fr=new FileReader;fr.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:'array',raw:false}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});rows=a.slice(1).map((v,i)=>{let name=String(v[0]||'').trim(),code=String(v[1]||'').trim(),e=[];if(!name)e.push('제품명 없음');if(!code)e.push('바코드 없음');return{row:i+2,name,code,e}}).filter(r=>r.name||r.code);let m={};rows.forEach(r=>r.code&&(m[r.code]=(m[r.code]||0)+1));rows.forEach(r=>r.code&&m[r.code]>1&&r.e.push('중복 바코드'));sel=0;$('data').hidden=false;msg(`${rows.length}개 행을 불러왔습니다.`);table();preview()}catch(e){msg('파일을 읽지 못했습니다.')}};fr.readAsArrayBuffer(f)}$('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');load(e.dataTransfer.files[0])};document.querySelector('.settings').oninput=e=>{if(e.target.dataset.k){s[e.target.dataset.k]=Math.max(0,+e.target.value);preview()}};$('suffix').oninput=preview;$('reset').onclick=()=>{s={...d};$('suffix').value='';sync();preview()};$('presetSave').onclick=()=>{let name=prompt('저장할 프리셋 이름을 입력하세요.');if(!name?.trim())return;name=name.trim();let p=presets();if(p[name]&&!confirm(`"${name}" 프리셋을 덮어쓸까요?`))return;p[name]=config();localStorage.setItem(presetKey,JSON.stringify(p));paintPresets(name)};$('presetLoad').onclick=()=>{let name=$('preset').value,p=presets();if(!name||!p[name])return alert('적용할 프리셋을 선택하세요.');apply(p[name])};$('presetDelete').onclick=()=>{let name=$('preset').value,p=presets();if(!name||!p[name])return;if(!confirm(`"${name}" 프리셋을 삭제할까요?`))return;delete p[name];localStorage.setItem(presetKey,JSON.stringify(p));paintPresets()};$('prev').onclick=()=>{sel--;table();preview()};$('next').onclick=()=>{sel++;table();preview()};$('include').onchange=table;$('one').onclick=()=>download(rows[sel]);$('tbody').onclick=e=>{let i=e.target.closest('[data-i]')?.dataset.i;if(i===undefined)return;if(e.target.classList.contains('png'))download(rows[i]);else{sel=+i;table();preview()}};$('zip').onclick=async()=>{let a=use(),z=new JSZip;if(!a.length)return;for(let i=0;i<a.length;i++){msg(`총 ${a.length}개 중 ${i+1}개 생성 중...`,true);let b=await new Promise(q=>render(a[i]).toBlob(q));z.file(fn(a[i].code),b);if(i%4===0)await new Promise(requestAnimationFrame)}let b=await z.generateAsync({type:'blob'},m=>msg(`ZIP 압축 중... ${Math.round(m.percent)}%`,true)),t=new Date,p=n=>String(n).padStart(2,'0');saveAs(b,`barcode_labels_${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}.zip`);msg(`완료: ${a.length}개 생성, 오류 ${rows.length-a.length}개 제외, ZIP ${(b.size/1048576).toFixed(2)} MB`)};sync();paintPresets();preview()})();</script></body></html>
